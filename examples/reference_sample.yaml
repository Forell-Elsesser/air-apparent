# air-apparent reference sample (schema_version 1)
#
# Runnable reproduction of the reference workbook benchmark (see docs/engineering_basis.md).
# Source cells refer to the reference workbook sheet `Chp 26` (inputs), `Chp 27`, `Chp 29`.
# ENGINEERING STATUS: workbook agreement only. Not independently code-validated.
#
# Offline demo geometry (examples built by air_apparent.demo) is SYNTHETIC. The 1472 ft x 240 ft
# plan is taken from the workbook inputs; model elevations below are demo values, NOT project
# values. Do not copy them into a live project.

schema_version: 1
code_edition: "ASCE 7-10"
units: "US"

wind:
  risk_category: "IV"                     # Chp 26!B6
  basic_wind_speed_mph: 120.0             # Chp 26!B9
  directionality_factor_kd: 0.85          # Chp 26!B10
  exposure_category: "C"                  # Chp 26!B11
  topographic_factor_kzt: 1.0             # Chp 26!B12
  gust_effect_factor_g: 0.85              # Chp 26!B13
  enclosure_classification: "enclosed"    # Chp 26!B14
  internal_pressure_coefficient_abs: 0.18 # Chp 26!B15
  mean_roof_height_above_grade_ft: 62.0   # Chp 26!B18

geometry:
  target: "entire_model"
  wind_axes: "global_xy"
  plan_dimensions_source: "yaml"          # offline benchmark: YAML dimensions are active
  plan_dimensions_ft:
    # In the workbook C21 and C22 were linked formulas (=B22, =B21): the Y-wind
    # parallel dimension equals the X-wind perpendicular dimension and vice versa.
    # The loader enforces that link.
    x_wind:
      parallel_l: 1472.0                  # Chp 26!B21
      perpendicular_b: 240.0              # Chp 26!B22
    y_wind:
      parallel_l: 240.0                   # Chp 26!C21 = B22
      perpendicular_b: 1472.0             # Chp 26!C22 = B21

loading:
  # Project example reflecting the later review of v5-3: -X uses Max, others keep Min.
  # This is a project choice, not a universal rule.
  wall_pressure_branch_by_direction:
    "+X": "Min"
    "-X": "Max"
    "+Y": "Min"
    "-Y": "Min"
  eccentricity_ratio: 0.15
  mechanical_patterns: "reversible_xy"
  # ILLUSTRATIVE PLACEHOLDER cumulative story shears (kip), top story first. Replace with
  # verified values or current ETABS results before using W_Ecc for anything but a demo.
  story_shears_kip:
    "+X": {ROOF: 100.0, L2: 220.0}
    "-X": {ROOF: 100.0, L2: 220.0}
    "+Y": {ROOF: 100.0, L2: 220.0}
    "-Y": {ROOF: 100.0, L2: 220.0}

grade:
  datum_model_elevation_ft: 0.0           # model elevation of grade (demo)
  roof_planes:
    - {id: MAIN, model_elevation_ft: 62.0}
    - {id: LOWER, model_elevation_ft: 61.0}   # roof under the penthouses (demo)

# Story pressure bands: windward pressure is evaluated at one height per band
# (workbook approximation: L2 at 31.5 ft and roof at 62 ft above grade).
story_bands:
  - {id: L2,   bottom_model_elevation_ft: 0.0,  top_model_elevation_ft: 31.5, evaluation_height_above_grade_ft: 31.5}
  - {id: ROOF, bottom_model_elevation_ft: 31.5, top_model_elevation_ft: 62.0, evaluation_height_above_grade_ft: 62.0}

parapets:
  types:
    - {id: TYP, kind: main_roof,      top_elevation_above_grade_ft: 67.0,  height_above_roof_ft: 5.0}
    - {id: PF,  kind: picture_frame,  top_elevation_above_grade_ft: 72.75, height_above_roof_ft: 10.75}
    - {id: PHP, kind: penthouse,      top_elevation_above_grade_ft: 76.9166666667, height_above_roof_ft: 0.5}

penthouses:
  - id: PH1
    plan_ft: {x_min: 100.0, x_max: 140.0, y_min: 100.0, y_max: 125.0}
    base_model_elevation_ft: 61.0
    body_height_ft: 15.4166666667
    centroid_elevation_above_grade_ft: 68.7083333333
    min_plan_dimension_ft: 25.0
    parapet_type: PHP
  - id: PH2
    plan_ft: {x_min: 700.0, x_max: 730.0, y_min: 100.0, y_max: 113.0}
    base_model_elevation_ft: 61.0
    body_height_ft: 15.4166666667
    # Back-solved from Chp 29!I17 (40.5888338495 psf); the workbook input cell was not provided.
    centroid_elevation_above_grade_ft: 69.4896416531
    min_plan_dimension_ft: 13.0
    parapet_type: PHP

rooftop:
  # q_z * G * Cf. Cf = 1.3 reproduces Chp 29!I16:I19. NOT yet verified against ASCE 7-10 29.5.
  net_force_coefficient_cf: 1.3

platforms:
  - id: PL1
    centroid_elevation_above_grade_ft: 71.0
    exposed_depth_ft: 3.5
    min_plan_dimension_ft: 12.0
    frames_x_wind: [PL1_A, PL1_B]
    frames_y_wind: [PL1_C, PL1_D]

equipment:
  - id: CHILLER01
    centroid_elevation_above_grade_ft: 77.0
    height_ft: 8.5
    extent_x_ft: 56.0   # length (X wind sees height x extent_y = 8.5 x 10 -> 3.525 kip)
    extent_y_ft: 10.0   # width  (Y wind sees height x extent_x = 8.5 x 56 -> 19.742 kip)
    support_joints: [CH01_J1, CH01_J2, CH01_J3, CH01_J4]
