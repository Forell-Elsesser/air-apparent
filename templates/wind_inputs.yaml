# air-apparent wind inputs template (schema_version 1). Copy, then edit every value.
# YAML is the only source of wind parameters; the GUI displays but does not edit them.
# Full schema: docs/module_interfaces.md ("Configuration schema").

schema_version: 1
code_edition: "ASCE 7-10"          # unsupported editions are rejected, never mapped to ASCE 7-10
units: "US"                         # ft, psf, kip

wind:
  risk_category: "IV"                     # I | II | III | IV            (Chp 26!B6)
  basic_wind_speed_mph: 120.0             # mph                          (Chp 26!B9)
  directionality_factor_kd: 0.85          #                              (Chp 26!B10)
  exposure_category: "C"                  # B | C | D                    (Chp 26!B11)
  topographic_factor_kzt: 1.0             #                              (Chp 26!B12)
  gust_effect_factor_g: 0.85              #                              (Chp 26!B13)
  enclosure_classification: "enclosed"    # enclosed | partially_enclosed | open (Chp 26!B14)
  internal_pressure_coefficient_abs: 0.18 # |GCpi|                       (Chp 26!B15)
  mean_roof_height_above_grade_ft: 62.0   # ft above grade               (Chp 26!B18)

geometry:
  target: "entire_model"                  # the whole connected model is the target
  wind_axes: "global_xy"
  plan_dimensions_source: "etabs"         # etabs | yaml
  # Comparison values when source is etabs; active values when source is yaml.
  plan_dimensions_ft:
    x_wind:
      parallel_l: 1472.0                  # Chp 26!B21
      perpendicular_b: 240.0              # Chp 26!B22
    y_wind:
      parallel_l: 240.0                   # Chp 26!C21 (linked: = x_wind.perpendicular_b)
      perpendicular_b: 1472.0             # Chp 26!C22 (linked: = x_wind.parallel_l)

loading:
  # Allowed: "Ext. Only" | "Max" (external + qh|GCpi|) | "Min" (external - qh|GCpi|).
  # One branch per wind direction, applied to every surface in that loading state.
  wall_pressure_branch_by_direction:
    "+X": "Min"
    "-X": "Max"
    "+Y": "Min"
    "-Y": "Min"
  eccentricity_ratio: 0.15
  mechanical_patterns: "reversible_xy"
  # Optional cumulative story shears (kip, top story first) used for W_Ecc:
  # story_shears_kip:
  #   "+X": {ROOF: 100.0, L2: 220.0}

grade:
  datum_model_elevation_ft: 0.0           # model elevation of grade (model z, ft)
  roof_planes:
    - {id: MAIN, model_elevation_ft: 62.0}

# Pressure bands in MODEL elevations; windward pressure is evaluated at the given
# height ABOVE GRADE. Shells must be subdivided at band boundaries.
story_bands:
  - {id: L2,   bottom_model_elevation_ft: 0.0,  top_model_elevation_ft: 31.5, evaluation_height_above_grade_ft: 31.5}
  - {id: ROOF, bottom_model_elevation_ft: 31.5, top_model_elevation_ft: 62.0, evaluation_height_above_grade_ft: 62.0}

parapets:
  types:
    - {id: TYP, kind: main_roof, top_elevation_above_grade_ft: 67.0, height_above_roof_ft: 5.0}
    # kind: main_roof | picture_frame | penthouse

# Optional sections (uncomment and fill in):
# penthouses:
#   - id: PH1
#     plan_ft: {x_min: 100.0, x_max: 140.0, y_min: 100.0, y_max: 125.0}   # model coordinates
#     base_model_elevation_ft: 61.0
#     body_height_ft: 15.4166666667
#     centroid_elevation_above_grade_ft: 68.7083333333   # optional; default base - grade + h/2
#     min_plan_dimension_ft: 25.0
#     parapet_type: PHP                                  # optional, a parapet type of kind penthouse
# rooftop:
#   net_force_coefficient_cf: 1.3   # q_z * G * Cf; unverified, see docs/engineering_basis.md
# platforms:
#   - id: PL1
#     centroid_elevation_above_grade_ft: 71.0
#     exposed_depth_ft: 3.5
#     min_plan_dimension_ft: 12.0
#     frames_x_wind: [FRAME_A]     # existing frames loaded by W_Mech_X
#     frames_y_wind: [FRAME_B]     # existing frames loaded by W_Mech_Y
# equipment:
#   - id: CHILLER01
#     centroid_elevation_above_grade_ft: 77.0
#     height_ft: 8.5
#     extent_x_ft: 56.0
#     extent_y_ft: 10.0
#     support_joints: [J1, J2, J3, J4]   # four EXISTING joints (equal share)

overrides: {}     # explicit categorization: {"<object name>": "<category>"}
