[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-apparent"
version = "0.1.0"
description = "ASCE 7-10 horizontal MWFRS wind loads assigned to an open ETABS model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
etabs = ["comtypes>=1.2; sys_platform == 'win32'"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
air-apparent = "air_apparent.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
